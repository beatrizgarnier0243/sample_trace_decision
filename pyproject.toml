[project]
name = "sample-trace-decision"
version = "0.1.3"
description = "A deterministic sampler that computes a trace_id hash and returns a keep-or-drop boolean based on a configurable rate, giving consistent decisions per trace."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
